<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2B7B"/>
      <stop offset="1" stop-color="#151f5c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top-left kicker -->
  <text x="80" y="130" font-family="Arial Narrow, Arial, sans-serif" font-size="26" font-weight="700"
        letter-spacing="6" fill="#45C8D8" text-transform="uppercase">FYPL B2030 · BINUS UNIVERSITY</text>

  <!-- Headline -->
  <text x="76" y="270" font-family="Arial Narrow, Arial, sans-serif" font-size="130" font-weight="900"
        fill="#ffffff" letter-spacing="-2">EVERY <tspan fill="#45C8D8" font-style="italic">STEP</tspan></text>
  <text x="76" y="400" font-family="Arial Narrow, Arial, sans-serif" font-size="130" font-weight="900"
        fill="#ffffff" letter-spacing="-2">EVERY <tspan fill="#45C8D8" font-style="italic">WAY</tspan></text>
  <text x="76" y="530" font-family="Arial Narrow, Arial, sans-serif" font-size="150" font-weight="900"
        font-style="italic" fill="#E8185A" letter-spacing="-4">OKAYYYY!</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="606" width="480" height="24" fill="#E8185A"/>
  <rect x="480" y="606" width="180" height="24" fill="#ffffff"/>
  <rect x="660" y="606" width="270" height="24" fill="#45C8D8"/>
  <rect x="930" y="606" width="270" height="24" fill="#2A3B9E"/>

  <!-- Campus tag bottom-right -->
  <text x="1120" y="130" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="600"
        fill="#ffffff" fill-opacity="0.6">@Kemanggisan</text>
</svg>
